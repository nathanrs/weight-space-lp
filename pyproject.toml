[project]
name = "wslp"
version = "0.1.0"
description = "Spec-and-solve: LP-compiled weight edits vs. LLM weight-space programming"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.6",
  "transformers>=5.17",
  "safetensors",
  "numpy",
  "scipy",
  "highspy",
  "huggingface_hub",
  "tqdm",
  "datasets>=5.1.0",
  "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
gpu = ["vllm", "math-verify"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wslp"]
