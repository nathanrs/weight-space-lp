[project]
name = "wslp"
version = "0.1.0"
description = "Fixing reasoning loops in Qwen3.5-0.8B with a weight edit computed by one linear program"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.6",
  "transformers>=5.17",
  "safetensors",
  "numpy",
  "scipy",
  "highspy",
  "huggingface_hub",
  "tqdm",
  "datasets>=5.1.0",
  "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
gpu = ["vllm", "math-verify"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wslp"]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
]

[project.entry-points."vllm.general_plugins"]
wslp_steer = "wslp.eval.steer:register"
